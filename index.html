<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>圓面積推導互動教具</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--soft:#edf2f8;--text:#172033;--muted:#66758c;--border:#d6dfeb;--accent:#2d63e8;--blue:#79a6ff;--red:#ff9c8d}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text)}
.wrap{width:min(1180px,calc(100% - 20px));margin:auto;padding:20px 0 40px}
h1{margin:0 0 6px;font-size:clamp(28px,4vw,40px)}p{color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,.55fr);gap:18px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:22px;padding:18px}
.head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.title{font-size:20px;font-weight:800}.hint{font-size:14px;color:var(--muted);margin-top:4px}.badge{border:1px solid var(--border);border-radius:999px;padding:8px 12px;font-weight:700}
.viz{margin-top:14px;background:var(--soft);border:1px solid var(--border);border-radius:18px;padding:8px}.viz svg{width:100%;height:auto;display:block}
.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px}.grp{display:flex;gap:10px;flex-wrap:wrap}
button{min-height:46px;border-radius:14px;border:1px solid var(--border);background:#fff;padding:10px 16px;font-size:16px;font-weight:700;cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button.magic{background:#fff5c9;border-color:#e7c449}
label{font-size:14px;font-weight:700;display:block}input[type=range]{width:100%;margin:10px 0 18px}.small{font-size:13px;color:var(--muted);line-height:1.6}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:var(--soft);border-radius:14px;padding:10px}.k{font-size:12px;color:var(--muted)}.v{font-size:17px;font-weight:800;margin-top:3px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin:10px 0 18px}.dot{display:inline-block;width:13px;height:13px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.hidden{display:none}.question,.final{margin-top:18px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.feedback{min-height:24px;margin-top:10px;font-weight:800}.good{color:#16803c}.bad{color:#b42318}
.formulas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.formula{background:var(--soft);border-radius:14px;padding:14px;text-align:center}.big{font-size:25px;font-weight:900}
.eq{text-align:center;font-size:clamp(30px,5vw,44px);font-weight:900;margin:18px 0 4px}
@media(max-width:850px){.grid{grid-template-columns:1fr}.answers,.formulas{grid-template-columns:1fr}.actions,.grp{width:100%}button{flex:1}.magic{flex-basis:100%}}
</style>
</head>
<body>
<main class="wrap">
<h1>圓面積推導互動教具</h1>
<p>把圓切得越細，再讓上下兩排扇形交錯排列，就會越來越接近長方形。</p>

<section class="grid">
<div class="card">
  <div class="head">
    <div><div class="title">圓的面積，為什麼是 πr²？</div><div id="instruction" class="hint"></div></div>
    <div id="stepBadge" class="badge"></div>
  </div>
  <div class="viz"><svg id="viz" viewBox="0 0 820 500"></svg></div>
  <div class="actions">
    <button id="prev">← 上一步</button>
    <div class="grp">
      <button id="magic" class="magic hidden">✨ 吸星大法</button>
      <button id="reset">重新開始</button>
      <button id="next" class="primary">下一步 →</button>
    </div>
  </div>
</div>

<aside class="card">
  <div class="title" style="font-size:18px;margin-bottom:14px">控制變因</div>
  <label>半徑 r：<span id="rt">5</span> cm</label>
  <input id="r" type="range" min="2" max="10" value="5">
  <label>等分數：<span id="nt">24</span> 份</label>
  <input id="n" type="range" min="6" max="200" step="2" value="24">
  <div class="small">建議比較 8、16、32、64、100、200 份，觀察上下鋸齒如何逐漸變平。</div>
  <div class="legend">
    <span><i class="dot" style="background:var(--blue)"></i>上半圓</span>
    <span><i class="dot" style="background:var(--red)"></i>下半圓</span>
  </div>
  <div class="stats">
    <div class="stat"><div class="k">半徑</div><div id="rv" class="v"></div></div>
    <div class="stat"><div class="k">圓周長</div><div id="cv" class="v"></div></div>
    <div class="stat"><div class="k">半圓周</div><div id="hcv" class="v"></div></div>
    <div class="stat"><div class="k">面積</div><div id="av" class="v"></div></div>
  </div>
</aside>
</section>

<section id="q" class="card question hidden">
  <div id="qt" class="title" style="font-size:18px"></div>
  <div id="qd" class="hint"></div>
  <div id="answers" class="answers"></div>
  <div id="fb" class="feedback"></div>
</section>

<section id="final" class="card final hidden">
  <div class="formulas">
    <div class="formula"><div class="k">底</div><div class="big">πr</div><div class="small">半個圓周長</div></div>
    <div class="formula"><div class="k">高</div><div class="big">r</div><div class="small">圓的半徑</div></div>
    <div class="formula"><div class="k">面積</div><div class="big">πr × r</div><div class="small">底 × 高</div></div>
  </div>
  <div class="eq">圓面積 = πr²</div>
</section>
</main>

<script>
(()=>{
const S=document.getElementById('viz'),NS='http://www.w3.org/2000/svg';
const r=document.getElementById('r'),n=document.getElementById('n'),rt=document.getElementById('rt'),nt=document.getElementById('nt');
const instruction=document.getElementById('instruction'),badge=document.getElementById('stepBadge');
const prev=document.getElementById('prev'),next=document.getElementById('next'),reset=document.getElementById('reset'),magic=document.getElementById('magic');
const q=document.getElementById('q'),qt=document.getElementById('qt'),qd=document.getElementById('qd'),answers=document.getElementById('answers'),fb=document.getElementById('fb'),final=document.getElementById('final');
let step=0,magicMode=false,raf=null,answered=false;
const texts=['先觀察完整的圓與半徑。','把圓切成很多個相同大小的扇形。','把上半圓與下半圓分成兩組。','讓兩組扇形上下交錯排列。','增加等分數，觀察圖形越來越接近長方形。','上下兩排交錯形成「接近長方形」的樣子，再找出底與高。'];

function E(t,a={}){const e=document.createElementNS(NS,t);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);return e}
function T(x,y,s,o={}){const e=E('text',{x,y,'text-anchor':o.a||'middle','font-size':o.z||16,'font-weight':o.w||700,fill:'#172033'});e.textContent=s;S.appendChild(e)}
function P(cx,cy,R,a){return{x:cx+R*Math.cos(a),y:cy+R*Math.sin(a)}}
function sector(cx,cy,R,a0,a1){const p0=P(cx,cy,R,a0),p1=P(cx,cy,R,a1);return`M ${cx} ${cy} L ${p0.x} ${p0.y} A ${R} ${R} 0 0 1 ${p1.x} ${p1.y} Z`}
function nums(){const R=+r.value,N=+n.value;rt.textContent=R;nt.textContent=N;rv.textContent=R+' cm';cv.textContent=(2*Math.PI*R).toFixed(2)+' cm';hcv.textContent=(Math.PI*R).toFixed(2)+' cm';av.textContent=(Math.PI*R*R).toFixed(2)+' cm²'}
function drawCircle(cut){
 const cx=410,cy=235,R=145,N=+n.value;
 if(!cut)S.appendChild(E('circle',{cx,cy,r:R,fill:'#79a6ff',opacity:.78,stroke:'#263142','stroke-width':2}));
 else for(let i=0;i<N;i++){const a0=-Math.PI/2+i*2*Math.PI/N,a1=-Math.PI/2+(i+1)*2*Math.PI/N,m=(a0+a1)/2,up=Math.sin(m)<0;S.appendChild(E('path',{d:sector(cx,cy,R,a0,a1),fill:up?'#79a6ff':'#ff9c8d',opacity:.82,stroke:'#263142','stroke-width':Math.max(.25,1.1-N/260)}))}
 S.appendChild(E('line',{x1:cx,y1:cy,x2:cx+R,y2:cy,stroke:'#172033','stroke-width':2}));T(cx+70,cy-10,'r',{z:18,w:850})
}
function interlocked(guides=false){
 const N=+n.value,pairs=Math.max(3,Math.floor(N/2)),L=75,R=735,M=250,H=150,w=(R-L)/pairs;
 for(let i=0;i<pairs;i++){
   const x0=L+i*w,x1=x0+w,xm=(x0+x1)/2;
   S.appendChild(E('path',{d:`M ${x0} ${M} L ${xm} ${M-H/2} L ${x1} ${M} Z`,fill:'#79a6ff',stroke:'#354052','stroke-width':Math.max(.25,1.15-N/250)}));
   S.appendChild(E('path',{d:`M ${x0} ${M} L ${xm} ${M+H/2} L ${x1} ${M} Z`,fill:'#ff9c8d',stroke:'#354052','stroke-width':Math.max(.25,1.15-N/250)}));
 }
 if(guides){
   S.appendChild(E('line',{x1:L,y1:78,x2:R,y2:78,stroke:'#172033','stroke-width':1.5}));
   S.appendChild(E('line',{x1:L,y1:69,x2:L,y2:87,stroke:'#172033','stroke-width':1.5}));
   S.appendChild(E('line',{x1:R,y1:69,x2:R,y2:87,stroke:'#172033','stroke-width':1.5}));
   T(405,58,'底 = 半個圓周長 = πr',{z:18,w:850});
   S.appendChild(E('line',{x1:765,y1:M-H/2,x2:765,y2:M+H/2,stroke:'#172033','stroke-width':1.5}));
   S.appendChild(E('line',{x1:756,y1:M-H/2,x2:774,y2:M-H/2,stroke:'#172033','stroke-width':1.5}));
   S.appendChild(E('line',{x1:756,y1:M+H/2,x2:774,y2:M+H/2,stroke:'#172033','stroke-width':1.5}));
   T(785,255,'高 = r',{a:'start',z:18,w:850});
 }
 T(410,445,`等分 ${N} 份｜上排藍色、下排紅色`,{z:17,w:850})
}
function magicView(p=1){
 const cx=410,cy=315,RR=145,N=+n.value,pairs=Math.max(3,Math.floor(N/2)),L=70,R=750,TOP=105,M=300,w=(R-L)/pairs;
 S.appendChild(E('circle',{cx,cy,r:RR,fill:'#ff9c8d',opacity:.22,stroke:'#354052','stroke-width':2}));
 S.appendChild(E('path',{d:`M ${cx-RR} ${cy} A ${RR} ${RR} 0 0 1 ${cx+RR} ${cy} L ${cx-RR} ${cy} Z`,fill:'#79a6ff',opacity:.24,stroke:'#354052','stroke-width':1.5}));
 for(let i=0;i<pairs;i++){
  const x0=L+i*w,x1=x0+w,xm=(x0+x1)/2;
  const sTop=[cx+(i/(pairs-1||1)-.5)*RR,cy-30],sBot=[cx+(i/(pairs-1||1)-.5)*RR,cy+30];
  const mix=(q,s)=>[s[0]+(q[0]-s[0])*p,s[1]+(q[1]-s[1])*p];
  const A=[[x0,TOP],[xm,M],[x1,TOP]].map(q=>mix(q,sTop));
  const B=[[x0,M],[xm,TOP],[x1,M]].map(q=>mix(q,sBot));
  S.appendChild(E('path',{d:`M ${A[0][0]} ${A[0][1]} L ${A[1][0]} ${A[1][1]} L ${A[2][0]} ${A[2][1]} Z`,fill:'#79a6ff',opacity:.72,stroke:'#263142','stroke-width':Math.max(.2,1-N/280)}));
  S.appendChild(E('path',{d:`M ${B[0][0]} ${B[0][1]} L ${B[1][0]} ${B[1][1]} L ${B[2][0]} ${B[2][1]} Z`,fill:'#ff9c8d',opacity:.68,stroke:'#263142','stroke-width':Math.max(.2,1-N/280)}));
 }
 S.appendChild(E('rect',{x:L,y:TOP,width:R-L,height:M-TOP,fill:'none',stroke:'#263142','stroke-width':1.5}));
 T(410,68,'吸星大法：把上下兩組扇形吸附到同一個長方形區域',{z:17,w:850});
 T(410,472,'保留原圓當背景，方便比較切割前與重組後',{z:15,w:700})
}
function ask(){
 q.classList.add('hidden');answers.innerHTML='';fb.textContent='';fb.className='feedback';answered=false;
 if(step===4){q.classList.remove('hidden');qt.textContent='小挑戰：重組後的底是什麼？';qd.textContent='上排弧長全部加起來，相當於原來圓周的一半。';makeAnswers(['圓周長 2πr','半個圓周長 πr','半徑 r','直徑 2r'],1,'底約等於 πr。')}
 if(step===5){q.classList.remove('hidden');qt.textContent='最後一題：這個「接近長方形」的面積怎麼算？';qd.textContent='底約等於 πr，高等於 r。';makeAnswers(['πr + r','2πr × r','πr × r','πr ÷ r'],2,'πr × r = πr²。')}
}
function makeAnswers(items,ok,msg){items.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s;b.onclick=()=>{fb.className='feedback '+(i===ok?'good':'bad');fb.textContent=i===ok?'✓ '+msg:'再想想看：底和高分別來自圓的哪一部分？';if(i===ok){answered=true;if(step===5)final.classList.remove('hidden')}};answers.appendChild(b)})}
function render(){
 if(raf){cancelAnimationFrame(raf);raf=null}nums();S.innerHTML='';instruction.textContent=texts[step];badge.textContent=`第 ${step+1} 步 / 6`;prev.disabled=step===0;next.textContent=step===5?'完成':'下一步 →';magic.classList.toggle('hidden',step<2);final.classList.add('hidden');
 if(magicMode&&step>=2)magicView(1);else if(step===0){drawCircle(false);T(410,430,'完整的圓',{z:20,w:850})}else if(step===1){drawCircle(true);T(410,430,'藍色＝上半圓　紅色＝下半圓',{z:18,w:850})}else if(step===2){drawCircle(true);T(410,430,'上下兩組扇形準備重新排列',{z:18,w:850})}else if(step===3){interlocked(false)}else if(step===4){interlocked(false);T(410,478,'把等分數拉到 100～200 份看看',{z:15,w:700})}else{interlocked(true)} ask()
}
function animateMagic(){magicMode=true;const t0=performance.now(),dur=900;function f(t){const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);S.innerHTML='';magicView(e);if(p<1)raf=requestAnimationFrame(f)}raf=requestAnimationFrame(f)}
magic.onclick=()=>{if(!magicMode){animateMagic();magic.textContent='↩ 回到交錯排列'}else{magicMode=false;magic.textContent='✨ 吸星大法';render()}};
prev.onclick=()=>{magicMode=false;magic.textContent='✨ 吸星大法';if(step>0){step--;render()}};
next.onclick=()=>{magicMode=false;magic.textContent='✨ 吸星大法';if(step<5){step++;render()}else if(answered)final.classList.remove('hidden')};
reset.onclick=()=>{step=0;magicMode=false;r.value=5;n.value=24;magic.textContent='✨ 吸星大法';render()};
r.oninput=()=>{magicMode=false;magic.textContent='✨ 吸星大法';render()};n.oninput=()=>render();
render();
})();
</script>
</body>
</html>
